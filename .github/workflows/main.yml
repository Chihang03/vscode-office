name: CI
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
    - run: npm ci --no-audit --no-fund
    - run: npm run package -- --out kieran-document-studio.vsix
    - run: npm run test:pdf
    - run: npm run test:audio
    - uses: actions/upload-artifact@v4
      with:
        name: kieran-document-studio
        path: kieran-document-studio.vsix
