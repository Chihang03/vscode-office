name: CI
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
    - id: manifest
      run: node -p "'version=' + require('./package.json').version" >> "$GITHUB_OUTPUT"
    - run: npm ci --no-audit --no-fund
    - run: npm run package
    - run: npm run test:pdf
    - run: npm run test:audio
    - run: npm run test:drawio
    - uses: actions/upload-artifact@v4
      with:
        name: kieran-document-studio-${{ steps.manifest.outputs.version }}
        path: ../outputs/vsix/kieran-document-studio-${{ steps.manifest.outputs.version }}.vsix
